# Stage 03 infra: Postgres + Redis.
# Ports chosen to avoid clashing with earlier stages and any host services:
#   Postgres 5436 (Stage 00=5433, 01=5434, 02=5435)
#   Redis    6380 (host already has a Redis on 6379)
services:
  db:
    image: postgres:16-alpine
    container_name: stage03-db
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5436:5432"
    volumes:
      - stage03_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stage03-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stage03_pgdata:
