# Postgres for the Stage 01 indexing lab.
# Host port 5434 keeps it separate from Stage 00 (5433).
services:
  db:
    image: postgres:16-alpine
    container_name: stage01-lab-db
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5434:5432"
    volumes:
      - stage01_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stage01_pgdata:
